<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b8860b">
    <title>ทำข้อสอบ | Treasury Quiz</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../shared/hub-nav.js"></script>
</head>

<body>
    <!-- Fullscreen Image Modal -->
    <div id="image-modal" class="image-modal" style="display: none;">
        <span id="modal-close" role="button" aria-label="ปิดรูปภาพ">&times;</span>
        <img id="modal-content" src="" alt="รูปประกอบคำถามแบบเต็มจอ">
    </div>

    <div class="container glass">
        <header class="header">
            <div>
                <img src="favicon.svg" alt="" width="40" height="40" style="border-radius: 11px;">
                <h1 class="title" id="quiz-title">ข้อสอบ</h1>
            </div>
            <div>
                <button class="btn btn-back" id="btn-quit">← ออก</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="สลับธีมสว่าง/มืด" title="สลับธีม">🌙</button>
            </div>
        </header>

        <main>
            <div id="loading" class="loading-state">กำลังโหลดข้อสอบ...</div>

            <div id="quiz-interface" class="quiz-container" style="display: none;">
                <div>
                    <div class="question-header">
                        <span id="question-progress">ข้อ 1 / 10</span>
                        <span id="answered-count"></span>
                        <span id="score-badge" class="score-badge" style="display: none;"></span>
                    </div>
                    <div class="quiz-progress" role="progressbar" aria-label="ความคืบหน้าของข้อสอบ" aria-valuemin="0"
                        aria-valuemax="100" aria-valuenow="0" id="quiz-progress">
                        <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
                    </div>
                </div>

                <div class="question-card glass" id="question-card">
                    <h2 class="question-text" id="question-text">คำถาม?</h2>
                    <img id="question-image" class="question-image" src="" alt="รูปประกอบคำถาม">

                    <div class="options-grid" id="options-container">
                        <!-- Options generated by JS -->
                    </div>

                    <div class="question-desc" id="container-desc" style="display: none;">
                        <!-- Description generated by JS -->
                    </div>
                </div>

                <div class="nav-buttons">
                    <button class="btn btn-back" id="btn-prev" disabled>← ย้อนกลับ</button>
                    <button class="btn" id="btn-next">ถัดไป →</button>
                    <button class="btn btn-accent" id="btn-submit" style="display: none;">✓ ตรวจคำตอบ</button>
                </div>
            </div>

            <div id="result-interface" class="result-container glass" style="display: none;">
                <span class="result-emoji" id="result-emoji">🏆</span>
                <h2>ผลคะแนนของคุณ</h2>

                <div class="result-ring">
                    <svg viewBox="0 0 190 190" aria-hidden="true">
                        <circle class="ring-track" cx="95" cy="95" r="80"></circle>
                        <circle class="ring-fill" id="ring-fill" cx="95" cy="95" r="80"></circle>
                    </svg>
                    <div class="result-ring-label">
                        <span class="result-percent" id="result-percent">0%</span>
                        <p class="result-score" id="result-score">0 / 0</p>
                    </div>
                </div>

                <p class="result-message" id="result-message"></p>
                <p class="result-submessage" id="result-submessage"></p>

                <div class="result-actions">
                    <button class="btn" id="btn-retry">🔄 ทำแบบทดสอบใหม่</button>
                    <button class="btn btn-accent" id="btn-review">📖 ดูเฉลย</button>
                    <button class="btn btn-back" onclick="window.history.back()">กลับไปหน้าเลือกชุดคำถาม</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const groupId = params.get('group');
            const code = params.get('code');
            const isHardcore = params.get('hardcore') === 'true';
            const limit = parseInt(params.get('limit')) || 0;
            const shuffleOptions = params.get('shuffle') === 'true';
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-content');
            const modalClose = document.getElementById('modal-close');

            const ui = {
                loading: document.getElementById('loading'),
                quizInterface: document.getElementById('quiz-interface'),
                resultInterface: document.getElementById('result-interface'),
                title: document.getElementById('quiz-title'),
                progress: document.getElementById('question-progress'),
                answered: document.getElementById('answered-count'),
                progressBar: document.getElementById('quiz-progress'),
                progressFill: document.getElementById('quiz-progress-fill'),
                qCard: document.getElementById('question-card'),
                qText: document.getElementById('question-text'),
                qImage: document.getElementById('question-image'),
                optContainer: document.getElementById('options-container'),
                descContainer: document.getElementById('container-desc'),
                btnPrev: document.getElementById('btn-prev'),
                btnNext: document.getElementById('btn-next'),
                btnSubmit: document.getElementById('btn-submit'),
                btnQuit: document.getElementById('btn-quit'),
                resScore: document.getElementById('result-score'),
                resPercent: document.getElementById('result-percent'),
                resEmoji: document.getElementById('result-emoji'),
                resMessage: document.getElementById('result-message'),
                resSubMessage: document.getElementById('result-submessage'),
                ringFill: document.getElementById('ring-fill'),
                btnReview: document.getElementById('btn-review'),
                btnRetry: document.getElementById('btn-retry')
            };

            ui.btnQuit.onclick = () => window.history.back();
            ui.btnRetry.onclick = () => window.location.reload();

            // Image click to open modal
            ui.qImage.onclick = () => {
                if (ui.qImage.src) {
                    modal.style.display = 'flex';
                    modalImg.src = ui.qImage.src;
                }
            };
            const closeImageModal = () => { modal.style.display = 'none'; };
            modalClose.onclick = closeImageModal;
            modal.onclick = (e) => {
                if (e.target === modal) closeImageModal();
            };
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'flex') closeImageModal();
            });

            let quizData = await loadAndDecryptQuizData();
            if (!quizData) {
                ui.loading.className = 'text-danger';
                ui.loading.style.cssText = 'text-align:center; padding:2rem;';
                ui.loading.textContent = 'ไม่สามารถโหลดข้อสอบได้';
                return;
            }

            let questions = [];

            if (isHardcore) {
                ui.title.textContent = "โหมด Hardcore";
                questions = shuffleArray(quizData);
                if (limit > 0 && limit < questions.length) {
                    questions = questions.filter(q => q.id.toString() === code).slice(0, limit);
                }
            } else {
                ui.title.textContent = `ชุดที่ ${groupId}`;
                questions = quizData.filter(q => q.group.toString() === groupId && q.id.toString() === code);
            }

            if (questions.length === 0) {
                ui.loading.className = '';
                ui.loading.style.cssText = 'text-align:center; padding:2rem; color:var(--text-muted);';
                ui.loading.textContent = 'ไม่พบคำถามในหมวดหมู่นี้';
                return;
            }

            // Shuffle options if requested
            if (shuffleOptions) {
                questions = questions.map(q => {
                    const originalAnsText = q.options[q.answer - 1];
                    const shuffledOpts = shuffleArray([...q.options]);
                    const newAnswerIndex = shuffledOpts.indexOf(originalAnsText) + 1;
                    return { ...q, options: shuffledOpts, answer: newAnswerIndex };
                });
            }

            ui.loading.style.display = 'none';
            ui.quizInterface.style.display = 'flex';

            let currentIndex = 0;
            const userAnswers = new Array(questions.length).fill(null);
            let isSubmitted = false;

            function updateProgress() {
                const percent = ((currentIndex + 1) / questions.length) * 100;
                ui.progressFill.style.width = `${percent}%`;
                ui.progressBar.setAttribute('aria-valuenow', Math.round(percent));

                const answeredCount = userAnswers.filter(a => a !== null).length;
                ui.answered.textContent = isSubmitted ? '' : `ตอบแล้ว ${answeredCount} / ${questions.length}`;
            }

            function renderQuestion() {
                const q = questions[currentIndex];
                ui.progress.textContent = `ข้อ ${currentIndex + 1} / ${questions.length}`;
                ui.qText.innerHTML = q.question;

                // เล่นอนิเมชัน slide-in ใหม่ทุกครั้งที่เปลี่ยนข้อ
                ui.qCard.classList.remove('q-enter');
                void ui.qCard.offsetWidth; // force reflow
                ui.qCard.classList.add('q-enter');

                if (q.image && q.image.trim() !== '') {
                    // Append .png if the database does not have an extension
                    const imgName = q.image.includes('.') ? q.image : `${q.image}.png`;
                    ui.qImage.src = `image/${imgName}`;
                    ui.qImage.style.display = 'block';
                } else {
                    ui.qImage.style.display = 'none';
                }

                ui.optContainer.innerHTML = '';
                q.options.forEach((optText, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `${index + 1}. ${optText}`;

                    if (userAnswers[currentIndex] === index + 1) {
                        btn.classList.add('selected');
                    }

                    if (isSubmitted) {
                        btn.disabled = true;
                        if (q.answer === index + 1) {
                            btn.classList.add('correct');
                        } else if (userAnswers[currentIndex] === index + 1 && q.answer !== index + 1) {
                            btn.classList.add('wrong');
                        }
                    } else {
                        btn.onclick = () => selectOption(index + 1);
                    }

                    ui.optContainer.appendChild(btn);

                    // --- เพิ่มส่วนแสดงคำอธิบาย (desc) ใต้ตัวเลือก ---
                    if (q.desc && q.desc.trim() !== '' && isSubmitted) {
                        ui.descContainer.innerHTML = q.desc;
                        ui.descContainer.style.display = 'block';
                    } else {
                        ui.descContainer.style.display = 'none';
                    }
                });

                ui.btnPrev.disabled = currentIndex === 0;

                if (currentIndex === questions.length - 1) {
                    ui.btnNext.style.display = 'none';
                    if (!isSubmitted) ui.btnSubmit.style.display = 'block';
                } else {
                    ui.btnNext.style.display = 'block';
                    ui.btnSubmit.style.display = 'none';
                }

                updateProgress();
            }

            function selectOption(ansNum) {
                userAnswers[currentIndex] = ansNum;
                renderQuestion();
            }

            ui.btnNext.onclick = () => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                }
            };

            ui.btnPrev.onclick = () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion();
                }
            };

            // ข้อความให้กำลังใจตามระดับคะแนน
            function getFeedback(percent) {
                if (percent >= 90) return { emoji: '🏆', msg: 'ยอดเยี่ยมมาก!', sub: 'คุณแม่นเนื้อหาชุดนี้แล้ว ลองท้าทายตัวเองในโหมด Hardcore ดูสิ' };
                if (percent >= 80) return { emoji: '🌟', msg: 'เก่งมาก!', sub: 'อีกนิดเดียวก็เต็มแล้ว ลองทบทวนข้อที่พลาดอีกรอบ' };
                if (percent >= 60) return { emoji: '💪', msg: 'ผ่านเกณฑ์แล้ว!', sub: 'พื้นฐานแน่นดี ทบทวนข้อที่ผิดเพื่อดันคะแนนให้สูงขึ้น' };
                if (percent >= 40) return { emoji: '📚', msg: 'ใกล้แล้ว สู้ต่อ!', sub: 'ลองดูเฉลยและทำซ้ำอีกรอบ คะแนนจะดีขึ้นแน่นอน' };
                return { emoji: '🌱', msg: 'เริ่มต้นใหม่ไปด้วยกัน', sub: 'ทุกคนเริ่มจากศูนย์ ลองอ่านเฉลยแล้วทำใหม่อีกครั้งนะ' };
            }

            function showResult(score) {
                const total = questions.length;
                const percent = total > 0 ? (score / total) * 100 : 0;
                const feedback = getFeedback(percent);

                ui.resScore.textContent = `${score} / ${total}`;
                ui.resPercent.textContent = `${percent.toFixed(0)}%`;
                ui.resEmoji.textContent = feedback.emoji;
                ui.resMessage.textContent = feedback.msg;
                ui.resSubMessage.textContent = feedback.sub;

                // วาดวงกลมคะแนน
                const radius = 80;
                const circumference = 2 * Math.PI * radius;
                ui.ringFill.style.strokeDasharray = `${circumference}`;
                ui.ringFill.style.strokeDashoffset = `${circumference}`;
                ui.ringFill.classList.remove('pass', 'fail');
                ui.ringFill.classList.add(percent >= 60 ? 'pass' : 'fail');
                requestAnimationFrame(() => {
                    ui.ringFill.style.strokeDashoffset = `${circumference * (1 - percent / 100)}`;
                });
            }

            ui.btnSubmit.onclick = () => {
                const unanswered = userAnswers.filter(a => a === null).length;
                if (unanswered > 0) {
                    const confirmSubmit = confirm(`คุณยังทำไม่ครบอีก ${unanswered} ข้อ ต้องการส่งเลยหรือไม่?`);
                    if (!confirmSubmit) return;
                }

                let score = 0;
                questions.forEach((q, i) => {
                    if (q.answer === userAnswers[i]) score++;
                });

                isSubmitted = true;
                ui.quizInterface.style.display = 'none';
                ui.resultInterface.style.display = 'block';
                showResult(score);
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Update Highscore
                if (!isHardcore) {
                    setHighScore(groupId, code, score);
                } else {
                    setHardcoreStats(groupId, code, questions.length, score);
                }
            };

            ui.btnReview.onclick = () => {
                ui.resultInterface.style.display = 'none';
                ui.quizInterface.style.display = 'flex';
                currentIndex = 0;

                // Show score badge
                const scoreBadge = document.getElementById('score-badge');
                scoreBadge.style.display = 'inline-block';
                scoreBadge.textContent = `คะแนน: ${ui.resScore.textContent}`;

                // Change submit button to return button
                ui.btnSubmit.textContent = 'ออกจากโหมดดูเฉลย';
                ui.btnSubmit.classList.remove('btn-accent');
                ui.btnSubmit.classList.add('btn-back');
                ui.btnSubmit.onclick = () => window.history.back();

                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            renderQuestion();
        });
    </script>
</body>

</html>
