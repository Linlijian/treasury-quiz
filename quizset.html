<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกชุดคำถาม</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container glass">
        <header class="header" style="flex-direction: column; align-items: stretch; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1 class="title">ชุดคำถาม</h1>
                <div>
                    <button class="btn btn-back" onclick="window.history.back()" style="margin-right: 0.5rem;">กลับ</button>
                    <button id="theme-toggle" class="theme-toggle" style="display: inline-flex;">🌙</button>
                </div>
            </div>
            
            <div class="controls-header glass">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="shuffle-checkbox">
                    สุ่มตัวเลือก
                </label>
                <button class="btn btn-danger" id="btn-hardcore">Hardcore Mode</button>
            </div>
            <div id="summary-container"></div>
        </header>

        <main>
            <div id="loading" style="text-align: center;">กำลังโหลดข้อมูล...</div>
            <div id="grid-container" class="grid" style="display: none;">
                <!-- Quiz sets will be injected here -->
            </div>
        </main>
    </div>

    <!-- Hardcore Modal -->
    <div class="modal-overlay" id="hardcore-modal">
        <div class="modal-content glass">
            <h3>เลือกจำนวนข้อ</h3>
            <div class="hardcore-options" id="hardcore-options">
                <!-- Options injected by JS -->
            </div>
            <button class="btn btn-back" id="btn-close-modal" style="width: 100%; margin-top: 1rem;">ยกเลิก</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('loading');
            const gridContainer = document.getElementById('grid-container');
            const shuffleCheckbox = document.getElementById('shuffle-checkbox');
            const btnHardcore = document.getElementById('btn-hardcore');
            const modal = document.getElementById('hardcore-modal');
            const btnCloseModal = document.getElementById('btn-close-modal');
            const hardcoreOptions = document.getElementById('hardcore-options');

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const code = urlParams.get('code');

            let quizData = await loadAndDecryptQuizData();
            
            if (!quizData || !code) {
                loading.textContent = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
                return;
            }
          
            loading.style.display = 'none';
            gridContainer.style.display = 'grid';

            // Group by 'group' field
            let groupId = null;
            const groups = {};
            const subGroups = quizData.filter(q => q.id == code);
            subGroups.forEach(q => {
                if (!groups[q.group]) {
                    groups[q.group] = [];
                }
                groups[q.group].push(q);

                if(groupId === null) {
                    groupId = q.group;
                }
            });

            // Render summary graph
            renderSummaryGraph(subGroups, groups);

            // Display standard sets
            Object.keys(groups).forEach(groupId => {
                console.log(`Rendering group ${groupId} with ${groups[groupId].length} questions`);
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'book-card glass';
                
                // Add Highscore Badge if exists
                let highScoreHtml = '';
                const highscore = getHighScore(groupId, code);
                if (highscore > 0) {
                    highScoreHtml = `<div class="score-badge" style="position: absolute; top: 10px; right: 10px; font-size: 0.8rem; background: var(--success);">${highscore}</div>`;
                }

                a.innerHTML = `
                    ${highScoreHtml}
                    <h4>ชุดที่ ${groupId}</h4>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--text-muted);">${groups[groupId].length} ข้อ</p>
                `;
                a.onclick = (e) => {
                    e.preventDefault();
                    startQuiz(groupId, false);
                };
                gridContainer.appendChild(a);
            });

            // Hardcore Mode setup
            const options = [5, 10, 15, 20, 30, 40, 50];
            options.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.style.padding = '0.5rem';
                btn.textContent = num;
                btn.onclick = () => {
                    startQuiz(groupId, true, num);
                };
                hardcoreOptions.appendChild(btn);
            });

            btnHardcore.onclick = () => modal.classList.add('active');
            btnCloseModal.onclick = () => modal.classList.remove('active');
            
            function startQuiz(groupId, isHardcore, limit = 0) {
                const shuffleOptions = shuffleCheckbox.checked;
                const params = new URLSearchParams();
                params.set('group', groupId);
                params.set('hardcore', isHardcore);
                params.set('code', code);
                if (isHardcore) params.set('limit', limit);
                params.set('shuffle', shuffleOptions);

                window.location.href = `quiz.html?${params.toString()}`;
            }

            function renderSummaryGraph(quizDataArray, groupData) {
                let totalCompleted = 0;
                let totalCorrect = 0;
                let totalSystemQuestions = quizDataArray.length;

                Object.keys(groupData).forEach(groupId => {
                    const scoreStr = localStorage.getItem(`highscore_group_${groupId}_code_${code}`);
                    if (scoreStr !== null) {
                        totalCompleted += groupData[groupId].length;
                        totalCorrect += parseInt(scoreStr);
                    }
                });

                const completionPercent = totalSystemQuestions > 0 ? (totalCompleted / totalSystemQuestions) * 100 : 0;
                const accuracyPercent = totalCompleted > 0 ? (totalCorrect / totalCompleted) * 100 : 0;
                const isGlobalPass = accuracyPercent >= 60;
                
                let html = `
                    <div class="summary-graph glass">
                        <h3>ภาพรวมการทำข้อสอบ (โหมดปกติ)</h3>
                        <div class="stat-row">
                            <div class="stat-row-header">
                                <span>ทำข้อสอบแล้ว</span>
                                <span>${totalCompleted} / ${totalSystemQuestions} ข้อ</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill primary" style="width: ${completionPercent}%"></div>
                            </div>
                        </div>
                        
                        <div class="stat-row">
                            <div class="stat-row-header">
                                <span>ความถูกต้อง</span>
                                <span>${totalCorrect} / ${totalCompleted} ข้อ (${accuracyPercent.toFixed(1)}%)</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill ${totalCompleted === 0 ? 'primary' : (isGlobalPass ? 'success' : 'danger')}" style="width: ${accuracyPercent}%"></div>
                            </div>
                            <div class="stat-status ${totalCompleted === 0 ? '' : (isGlobalPass ? 'text-success' : 'text-danger')}">
                                ${totalCompleted === 0 ? 'ยังไม่มีข้อมูล' : 'สถานะ: ' + (isGlobalPass ? '🟢 ผ่านเกณฑ์ 60%' : '🔴 ไม่ผ่านเกณฑ์')}
                            </div>
                        </div>
                `;

                const hardcoreStats = getHardcoreStats(groupId, code);
                if (hardcoreStats) {
                    const hcPercent = (hardcoreStats.correct / hardcoreStats.selected) * 100;
                    const isHcPass = hcPercent >= 60;
                    html += `
                        <hr style="margin: 1.5rem 0; border-color: rgba(128,128,128,0.2);">
                        <h3>โหมด Hardcore (ล่าสุด)</h3>
                        <div class="stat-row">
                            <div class="stat-row-header">
                                <span>ความถูกต้อง</span>
                                <span>${hardcoreStats.correct} / ${hardcoreStats.selected} ข้อ (${hcPercent.toFixed(1)}%)</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill ${isHcPass ? 'success' : 'danger'}" style="width: ${hcPercent}%"></div>
                            </div>
                            <div class="stat-status ${isHcPass ? 'text-success' : 'text-danger'}">
                                สถานะ: ${isHcPass ? '🟢 ผ่านเกณฑ์ 60%' : '🔴 ไม่ผ่านเกณฑ์'}
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
                document.getElementById('summary-container').innerHTML = html;
            }
        });
    </script>
</body>
</html>
