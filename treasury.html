<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b8860b">
    <title>คลังข้อสอบ | Treasury Quiz</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container glass">
        <header class="header">
            <div>
                <img src="favicon.svg" alt="" width="44" height="44" style="border-radius: 12px;">
                <div>
                    <h1 class="title">คลังข้อสอบ</h1>
                    <p style="color: var(--text-muted); font-size: .9rem;">เลือกวิชาที่ต้องการ</p>
                </div>
            </div>
            <div>
                <a href="index.html" class="btn btn-back">← กลับ</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="สลับธีมสว่าง/มืด" title="สลับธีม">🌙</button>
            </div>
        </header>

        <main>
            <div id="grid-container" class="grid">
                <!-- Books will be injected here -->
            </div>
            <div id="loading" class="loading-state">กำลังโหลดรายวิชา...</div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');
            const gridContainer = document.getElementById('grid-container');
            const loading = document.getElementById('loading');

            function showMessage(text, isError) {
                loading.style.display = 'none';
                gridContainer.innerHTML =
                    `<p class="${isError ? 'text-danger' : ''}" style="grid-column:1/-1; text-align:center; padding:2rem; color:${isError ? '' : 'var(--text-muted)'};">${text}</p>`;
            }

            if (!targetId) {
                showMessage('ไม่พบรหัสอ้างอิง', true);
                return;
            }

            Papa.parse('treasury.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const filtered = data.filter(row => row.id === targetId);

                    if (filtered.length === 0) {
                        showMessage('ไม่มีข้อมูลสำหรับหมวดหมู่นี้', false);
                        return;
                    }

                    loading.style.display = 'none';

                    filtered.forEach(item => {
                        const a = document.createElement('a');
                        a.href = `quizset.html?code=${item.code}`;
                        a.className = 'book-card glass';
                        a.innerHTML = `
                            <h4>${item.name}</h4>
                        `;
                        gridContainer.appendChild(a);
                    });
                },
                error: function(err) {
                    console.error("Error parsing CSV:", err);
                    showMessage('เกิดข้อผิดพลาดในการอ่านข้อมูล', true);
                }
            });
        });
    </script>
</body>
</html>
